name: Atualizando o GitHub CR7

## mecanismo para agendamento de update
on:
  schedule:
    ## executa todos os dias às 0h (horario de brasilia / 3h utc)
    - cron: '0 3 * * *'
  workflow_dispatch: ## gatilho manual para update sob demanda

jobs:
  update-data:
    runs-on: ubuntu-latest

    ## permissao para armazenamento e atualizacao no repositorio
    permissions:
      contents: write

    steps:
      - name: Extrai o repositorio
        uses: actions/checkout@v4

      - name: Configura o R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Instala dependencias do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev

      - name: Instala pacotes R
        run: |
          install.packages(c("dplyr", "stringr", "tidyr", "lubridate", "purrr", "rlang", "jsonlite", "glue"))
        shell: Rscript {0}

      - name: Executa o pipeline
        run: |
          source("R/00_runPipeline.R")
        shell: Rscript {0}

      - name: Commita e faz o push
        run: |
          git config --local user.name "GitHub Actions Bot"
          git config --local user.email "actions@github.com"
          git add docs/index.html
          git commit -m "Update: Atualização da base de gols do CR7" || echo "Sem mudanças para commitar"
          git push
